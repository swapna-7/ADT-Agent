name: Secret scan

on:
  push:
  pull_request:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Omit base/head on push: both resolve to the same commit on main and
          # TruffleHog exits with "BASE and HEAD commits are the same".
          # The action uses github.event.before/after for push diffs by default.
