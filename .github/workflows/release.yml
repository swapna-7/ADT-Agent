name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        name: VERSION must match version.py and the git tag
        run: |
          python3 << 'PY'
          import os
          import re
          import sys
          from pathlib import Path

          file_ver = Path("VERSION").read_text(encoding="utf-8").strip()
          text = Path("common/version.py").read_text(encoding="utf-8")
          match = re.search(r'AGENT_VERSION\s*=\s*"([^"]+)"', text)
          if not match:
              sys.exit("AGENT_VERSION missing from version.py")
          py_ver = match.group(1)
          if file_ver != py_ver:
              sys.exit(f"VERSION ({file_ver}) != version.py ({py_ver})")
          ref = os.environ.get("GITHUB_REF", "")
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if tag.startswith("v"):
              tag = tag[1:]
          if ref.startswith("refs/tags/") and tag != file_ver:
              sys.exit(f"tag v{tag} != VERSION {file_ver}")
          print(file_ver)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={file_ver}\n")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r common/requirements.txt pytest
      - name: pytest
        run: python -m pytest tests/ -q

  build:
    needs: [version-check, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: adt-agent-windows.exe
          - os: ubuntu-latest
            artifact: adt-agent-linux
          - os: macos-latest
            artifact: adt-agent-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if platform .env files exist
        shell: bash
        run: |
          for path in windows/.env linux/.env mac/.env .env; do
            if [ -f "$path" ]; then
              echo "Refusing to build: $path must not be present in release builds"
              exit 1
            fi
          done
      - name: Generate api_config.py
        env:
          VIZHI_API_BASE: ${{ secrets.VIZHI_API_BASE }}
          AGENT_VERIFY_PUBLIC_KEY: ${{ secrets.AGENT_VERIFY_PUBLIC_KEY }}
        shell: bash
        run: |
          if [ -z "$VIZHI_API_BASE" ]; then
            echo "VIZHI_API_BASE secret is required for release builds"
            exit 1
          fi
          python generate_api_config.py "$VIZHI_API_BASE"
      - name: Validate user_helper.ps1 (PS 5.1 parse + smoke)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $script = Join-Path $PWD 'windows\scripts\validate-user-helper.ps1'
          & $script -ScriptPath (Join-Path $PWD 'windows\user_helper.ps1') -SmokeTest
      - name: Build Windows
        if: runner.os == 'Windows'
        env:
          VIZHI_API_BASE: ${{ secrets.VIZHI_API_BASE }}
          AGENT_VERIFY_PUBLIC_KEY: ${{ secrets.AGENT_VERIFY_PUBLIC_KEY }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\build.ps1
      - name: Build Linux
        if: runner.os == 'Linux'
        env:
          VIZHI_API_BASE: ${{ secrets.VIZHI_API_BASE }}
          AGENT_VERIFY_PUBLIC_KEY: ${{ secrets.AGENT_VERIFY_PUBLIC_KEY }}
        run: |
          chmod +x linux/build.sh
          ./linux/build.sh
      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          VIZHI_API_BASE: ${{ secrets.VIZHI_API_BASE }}
          AGENT_VERIFY_PUBLIC_KEY: ${{ secrets.AGENT_VERIFY_PUBLIC_KEY }}
        run: |
          chmod +x mac/build.sh
          ./mac/build.sh
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist-release
          case "${RUNNER_OS}" in
            Windows) cp windows/dist/adt-agent.exe "dist-release/${{ matrix.artifact }}" ;;
            Linux)   cp linux/dist/adt-agent "dist-release/${{ matrix.artifact }}" ;;
            macOS)   cp mac/dist/adt-agent "dist-release/${{ matrix.artifact }}" ;;
            *) echo "Unknown runner OS ${RUNNER_OS}"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-release/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: [version-check, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Sign binaries and write latest.json
        env:
          AGENT_SIGNING_PRIVATE_KEY: ${{ secrets.AGENT_SIGNING_PRIVATE_KEY }}
          RELEASE_ASSETS_DIR: release-assets
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=50.0.0"
          python scripts/sign_release_assets.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/adt-agent-windows.exe
            release-assets/adt-agent-linux
            release-assets/adt-agent-macos
            release-assets/adt-agent-windows.exe.sig
            release-assets/adt-agent-linux.sig
            release-assets/adt-agent-macos.sig
            latest.json
          generate_release_notes: true
          fail_on_unmatched_files: false
