name: user_helper.ps1 validation

on:
  push:
    paths:
      - "windows/user_helper.ps1"
      - "windows/user_helper_task.py"
      - "windows/scripts/validate-user-helper.ps1"
      - "windows/scripts/fixtures/**"
      - ".github/workflows/user-helper-validate.yml"
  pull_request:
    paths:
      - "windows/user_helper.ps1"
      - "windows/user_helper_task.py"
      - "windows/scripts/validate-user-helper.ps1"
      - "windows/scripts/fixtures/**"
      - ".github/workflows/user-helper-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate user_helper.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "windows/user_helper.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error "Line $($_.Extent.StartLineNumber): $($_.Message)"
            }
            exit 1
          }
          Write-Host "Syntax OK — $($tokens.Count) tokens parsed"

      - name: Reject known-bad WinRT syntax fixture
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "windows/scripts/fixtures/user_helper_bad_winrt.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -eq 0) {
            Write-Error "Expected parse failure for bad fixture"
            exit 1
          }
          Write-Host "Bad fixture correctly rejected ($($errors.Count) error(s))"
